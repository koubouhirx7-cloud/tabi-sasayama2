<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>事例紹介・ストーリー詳細｜ウイズささやま</title>
    <meta
      name="description"
      content="丹波篠山で地域のみなさんと一緒につくった旅の事例と、その背景にあるストーリーを紹介します。"
    />
    <link rel="stylesheet" href="./style.css" />
    <style>
      .case-detail-page {
        background: #ffffff;
        color: #293330;
      }

      .case-detail-page .header {
        background: rgba(255, 255, 255, 0.97);
        backdrop-filter: blur(10px);
        padding: 1rem 0;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.06);
      }

      .case-detail-page .logo img {
        height: 65px;
      }

      .case-detail-main {
        padding-top: 98px;
      }

      .case-detail-shell {
        width: min(1180px, 90%);
        min-height: 620px;
        margin: 0 auto;
        padding: 64px 0 82px;
      }

      .case-detail-preview-note {
        display: none;
        width: fit-content;
        margin-bottom: 22px;
        padding: 7px 12px;
        border: 1px solid #b9b09a;
        color: #756d5d;
        font-size: 0.76rem;
        line-height: 1;
      }

      .case-detail-heading {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 18px;
        margin-bottom: 30px;
      }

      .case-detail-number {
        color: #1f2726;
        font-family: var(--font-en);
        font-size: clamp(2.8rem, 5vw, 4.4rem);
        line-height: 1;
        letter-spacing: 0;
      }

      .case-detail-title {
        min-width: 0;
        color: #273230;
        font-size: clamp(1.28rem, 2.4vw, 2rem);
        font-weight: 500;
        line-height: 1.5;
        letter-spacing: 0.04em;
      }

      .case-detail-date {
        min-width: 84px;
        padding: 9px 13px;
        background: #211b19;
        color: #ffffff;
        font-family: var(--font-en);
        font-size: 0.76rem;
        line-height: 1;
        text-align: center;
      }

      .case-voice {
        display: grid;
        grid-template-columns: 132px minmax(0, 1fr);
        gap: 24px;
        margin-bottom: 42px;
      }

      .case-voice-label {
        color: #4d5753;
        font-size: 0.86rem;
        line-height: 1.7;
      }

      .case-voice-icon {
        position: relative;
        display: block;
        width: 44px;
        height: 27px;
        margin: 10px 0 0 18px;
        border-radius: 18px;
        background: #211b19;
      }

      .case-voice-icon::after {
        content: "";
        position: absolute;
        left: 7px;
        bottom: -8px;
        width: 0;
        height: 0;
        border-top: 10px solid #211b19;
        border-right: 10px solid transparent;
      }

      .case-voice-content {
        color: #4c5652;
        font-size: 0.93rem;
        line-height: 1.9;
      }

      .case-voice-content p + p {
        margin-top: 8px;
      }

      .case-voice-meta {
        margin-top: 12px;
        color: #7a817e;
        font-size: 0.78rem;
      }

      .case-detail-content {
        display: grid;
        grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.2fr);
        gap: 18px;
        align-items: stretch;
      }

      .case-gallery {
        min-width: 0;
      }

      .case-gallery-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px;
        height: 100%;
        min-height: 310px;
      }

      .case-gallery-grid.is-single {
        grid-template-columns: 1fr;
      }

      .case-gallery-item {
        position: relative;
        min-height: 150px;
        overflow: hidden;
        background: #eef1ee;
      }

      .case-gallery-grid.is-single .case-gallery-item {
        min-height: 310px;
      }

      .case-gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .case-gallery-item.is-empty::after {
        content: "PHOTO";
        position: absolute;
        inset: 50% auto auto 50%;
        transform: translate(-50%, -50%);
        color: rgba(32, 60, 61, 0.3);
        font-family: var(--font-en);
        font-size: 0.78rem;
        letter-spacing: 0.12em;
      }

      .case-gallery-dots {
        min-height: 18px;
        margin-top: 16px;
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      .case-gallery-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #96918e;
      }

      .case-gallery-dot:first-child {
        background: #203c3d;
      }

      .case-facts {
        border-top: 1px solid #979d9a;
        border-left: 1px solid #979d9a;
      }

      .case-fact-row {
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr);
        border-right: 1px solid #979d9a;
        border-bottom: 1px solid #979d9a;
      }

      .case-fact-label {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px 12px;
        border-right: 1px solid #979d9a;
        color: #4c5652;
        font-size: 0.84rem;
      }

      .case-fact-body {
        padding: 17px 20px;
        color: #4b5551;
        font-size: 0.86rem;
        line-height: 1.85;
      }

      .case-fact-body p + p,
      .case-fact-body ul,
      .case-fact-body ol {
        margin-top: 8px;
      }

      .case-fact-body ul,
      .case-fact-body ol {
        padding-left: 1.4em;
      }

      .case-detail-back {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-top: 42px;
        color: #354744;
        font-size: 0.86rem;
        text-decoration: none;
      }

      .case-detail-back::before {
        content: "←";
        font-family: var(--font-en);
        font-size: 1.1rem;
      }

      .case-detail-loading,
      .case-detail-error {
        padding: 72px 0;
        color: #6d7471;
        text-align: center;
      }

      .case-detail-page .footer {
        background: #203c3d;
        border-top: 0;
        color: rgba(255, 255, 255, 0.84);
        padding: 68px 0 32px;
      }

      .case-detail-page .footer-logo,
      .case-detail-page .footer-info,
      .case-detail-page .footer-nav-col a,
      .case-detail-page .footer-bottom {
        color: rgba(255, 255, 255, 0.84);
      }

      .case-detail-page .footer-bottom {
        border-top-color: rgba(255, 255, 255, 0.18);
      }

      .case-detail-page .footer-left {
        display: flex;
        align-items: flex-start;
        gap: 22px;
      }

      .case-detail-page .footer-mark {
        width: 112px;
        height: auto;
        flex: 0 0 auto;
      }

      @media (max-width: 900px) {
        .case-detail-content {
          grid-template-columns: 1fr;
          gap: 30px;
        }

        .case-gallery-grid {
          min-height: 420px;
        }

        .case-gallery-grid.is-single .case-gallery-item {
          min-height: 420px;
        }
      }

      @media (max-width: 720px) {
        .case-detail-main {
          padding-top: 94px;
        }

        .case-detail-shell {
          padding: 38px 0 60px;
        }

        .case-detail-heading {
          grid-template-columns: auto minmax(0, 1fr);
          gap: 10px 14px;
        }

        .case-detail-date {
          grid-column: 2;
          width: fit-content;
        }

        .case-voice {
          grid-template-columns: 1fr;
          gap: 14px;
          margin-bottom: 32px;
        }

        .case-voice-icon {
          display: inline-block;
          margin: 0 0 -7px 12px;
          transform: scale(0.76);
          transform-origin: left center;
        }

        .case-gallery-grid,
        .case-gallery-grid.is-single {
          min-height: 0;
        }

        .case-gallery-item,
        .case-gallery-grid.is-single .case-gallery-item {
          min-height: 0;
          aspect-ratio: 4 / 3;
        }

        .case-fact-row {
          grid-template-columns: 1fr;
        }

        .case-fact-label {
          justify-content: flex-start;
          padding: 10px 14px;
          border-right: 0;
          border-bottom: 1px solid #979d9a;
          background: #eef1ee;
        }

        .case-fact-body {
          padding: 14px;
        }

        .case-detail-page .footer-left {
          display: block;
        }

        .case-detail-page .footer-mark {
          width: 104px;
          margin-bottom: 18px;
        }
      }
    </style>
  </head>
