<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>最新情報・イベント告知｜丹波篠山旅・里山体験｜ウイズささやま</title>
    <meta
      name="description"
      content="ウイズささやまの最新情報・イベント開催告知。丹波篠山の農業体験、里山トラベル、教育プログラムのお知らせを随時更新します。"
    />
    <link rel="stylesheet" href="./style.css" />
    <style>
      .news-page {
        --news-ink: #263d3c;
        --news-muted: #7f8582;
        --news-line: #d5d8d5;
        --news-accent: #b5a883;
        --news-footer: #203c3d;
        background: #fff;
        color: var(--news-ink);
      }

      .news-page .header {
        background: rgba(255, 255, 255, 0.97);
        border-bottom: 1px solid #ecefed;
        box-shadow: none;
      }

      .news-page .news-main {
        padding-top: 166px;
      }

      .news-page .news-inner {
        width: min(100% - 40px, 1060px);
        margin: 0 auto;
      }

      .news-page .news-heading {
        display: flex;
        align-items: center;
        gap: 24px;
        margin-bottom: 42px;
      }

      .news-page .news-heading-mark {
        flex: 0 0 8px;
        width: 8px;
        height: 78px;
        background: var(--news-ink);
      }

      .news-page .news-heading-copy {
        position: relative;
        width: min(390px, 64vw);
      }

      .news-page .news-title-image {
        width: 100%;
        height: auto;
      }

      .news-page .news-heading-en {
        position: absolute;
        right: 12%;
        bottom: -3px;
        font-family: var(--font-en);
        font-size: 1.05rem;
        font-style: italic;
        letter-spacing: 0.08em;
        color: #394e4c;
      }

      .news-page .news-index {
        padding-bottom: 68px;
      }

      .news-page .news-layout {
        display: grid;
        grid-template-columns: 190px minmax(0, 1fr);
        gap: 44px;
        align-items: start;
      }

      .news-page .news-sidebar {
        display: grid;
        gap: 12px;
      }

      .news-page .sidebar-box {
        border: 1px solid #858d8a;
        background: #fff;
        padding: 13px 12px 14px;
      }

      .news-page .sidebar-title {
        margin-bottom: 8px;
        color: #5f6865;
        font-family: var(--font-base);
        font-size: 0.82rem;
        font-weight: 400;
        letter-spacing: 0.08em;
      }

      .news-page .sidebar-list {
        display: grid;
        gap: 1px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .news-page .sidebar-list a {
        display: block;
        min-height: 27px;
        padding: 3px 8px;
        color: #67706d;
        font-size: 0.82rem;
        line-height: 1.6;
        letter-spacing: 0.06em;
      }

      .news-page .sidebar-list a:hover {
        opacity: 1;
        background: #f2f1ec;
      }

      .news-page .sidebar-list a.active {
        background: var(--news-accent);
        color: #fff;
      }

      .news-page .news-list {
        border-top: 1px solid var(--news-line);
      }

      .news-page .news-row {
        display: grid;
        grid-template-columns: 118px minmax(0, 1fr) 122px;
        gap: 18px;
        align-items: center;
        min-height: 66px;
        border-bottom: 1px solid var(--news-line);
        color: inherit;
      }

      .news-page .news-row:hover {
        opacity: 1;
        background: #fafaf8;
      }

      .news-page .news-date {
        color: #b5aa90;
        font-size: 0.84rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0;
      }

      .news-page .news-title {
        min-width: 0;
        color: #5b6260;
        font-size: 0.92rem;
        font-weight: 400;
        line-height: 1.6;
        letter-spacing: 0.04em;
      }

      .news-page .news-category {
        justify-self: end;
        min-width: 110px;
        padding: 5px 9px;
        background: var(--news-accent);
        color: #fff;
        font-size: 0.73rem;
        line-height: 1.35;
        text-align: center;
        letter-spacing: 0.04em;
      }

      .news-page .news-empty {
        padding: 52px 16px;
        border-bottom: 1px solid var(--news-line);
        color: var(--news-muted);
        font-size: 0.9rem;
        line-height: 1.8;
        text-align: center;
      }

      .news-page .news-pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 11px;
        min-height: 54px;
        padding-top: 20px;
      }

      .news-page .pagination-btn {
        width: 11px;
        height: 11px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: #9b9b97;
        color: transparent;
        cursor: pointer;
      }

      .news-page .pagination-btn:hover,
      .news-page .pagination-btn.active {
        opacity: 1;
        background: #4a5f5d;
      }

      .news-page .pagination-btn[disabled] {
        display: none;
      }

      .news-page .news-season {
        height: clamp(320px, 43vw, 540px);
        overflow: hidden;
        background: #91a954;
      }

      .news-page .news-season img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 56%;
      }

      .news-page .footer {
        border-top: 0;
        background: var(--news-footer);
        color: rgba(255, 255, 255, 0.84);
        padding: 46px 0 24px;
      }

      .news-page .footer-top {
        align-items: flex-start;
        margin-bottom: 38px;
      }

      .news-page .footer-left {
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr);
        gap: 24px;
        align-items: start;
        max-width: 560px;
      }

      .news-page .footer-mark {
        width: 92px;
        height: auto;
      }

      .news-page .footer-logo,
      .news-page .footer-info,
      .news-page .footer-nav-col a,
      .news-page .footer-bottom {
        color: rgba(255, 255, 255, 0.8);
      }

      .news-page .footer-logo {
        margin-bottom: 6px;
        font-size: 1.5rem;
        letter-spacing: 0.08em;
      }

      .news-page .footer-info {
        font-size: 0.8rem;
        line-height: 1.9;
      }

      .news-page .footer-nav {
        gap: 54px;
      }

      .news-page .footer-nav-col {
        gap: 7px;
      }

      .news-page .footer-nav-col a {
        font-size: 0.82rem;
      }

      .news-page .footer-bottom {
        border-top-color: rgba(255, 255, 255, 0.2);
      }

      @media (max-width: 860px) {
        .news-page .news-main {
          padding-top: 132px;
        }

        .news-page .news-layout {
          grid-template-columns: 1fr;
          gap: 28px;
        }

        .news-page .news-sidebar {
          grid-template-columns: 1fr 1fr;
        }

        .news-page .sidebar-list {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .news-page .news-row {
          grid-template-columns: 104px minmax(0, 1fr) 116px;
        }
      }

      @media (max-width: 600px) {
        .news-page .news-inner {
          width: min(100% - 28px, 1060px);
        }

        .news-page .news-heading {
          gap: 16px;
          margin-bottom: 32px;
        }

        .news-page .news-heading-mark {
          flex-basis: 6px;
          width: 6px;
          height: 54px;
        }

        .news-page .news-heading-copy {
          width: min(300px, calc(100vw - 76px));
        }

        .news-page .news-heading-en {
          right: 8%;
          bottom: -5px;
          font-size: 0.88rem;
        }

        .news-page .news-sidebar {
          grid-template-columns: 1fr;
        }

        .news-page .sidebar-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .news-page .news-row {
          grid-template-columns: 88px minmax(0, 1fr);
          gap: 8px 12px;
          min-height: 82px;
          padding: 10px 0;
        }

        .news-page .news-date {
          grid-column: 1;
          grid-row: 1;
        }

        .news-page .news-title {
          grid-column: 2;
          grid-row: 1 / span 2;
          align-self: center;
          font-size: 0.86rem;
        }

        .news-page .news-category {
          grid-column: 1;
          grid-row: 2;
          justify-self: start;
          min-width: 82px;
          padding: 4px 5px;
          font-size: 0.65rem;
        }

        .news-page .news-index {
          padding-bottom: 44px;
        }

        .news-page .news-season {
          height: 290px;
        }

        .news-page .footer-nav {
          width: 100%;
          gap: 28px;
        }

        .news-page .footer-left {
          grid-template-columns: 58px minmax(0, 1fr);
          gap: 16px;
          max-width: none;
          width: 100%;
        }

        .news-page .footer-mark {
          width: 58px;
        }

        .news-page .footer-logo {
          font-size: 1.08rem;
        }
      }
    </style>
