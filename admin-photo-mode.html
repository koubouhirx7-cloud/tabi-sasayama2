<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS管理画面: フォトモード (AI記事生成) | ウイズささやま</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      background: #f4f5f7; margin: 0; padding: 0; height: 100vh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .admin-header {
      background: var(--color-primary, #333); color: white; padding: 15px 30px;
      display: flex; justify-content: space-between; align-items: center; z-index: 10;
    }
    .admin-header h1 { margin: 0; font-size: 1.2rem; }
    .btn-save { background: #fff; color: var(--color-primary, #333); border: none; padding: 8px 24px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-save:hover { background: #eee; }
    .btn-generate { background: #8b5cf6; color: white !important; }
    .btn-generate:hover { background: #7c3aed; }
    .admin-layout { display: flex; flex: 1; overflow: hidden; }
    .admin-pane-left {
      width: 450px; min-width: 350px; max-width: 60vw; background: white;
      border-right: 1px solid #ddd; padding: 30px; overflow: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.05); z-index: 5;
    }
    .form-group { margin-bottom: 24px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9rem; color: #555; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem;
    }
    .form-group textarea { min-height: 120px; resize: vertical; }
    .image-upload-zone {
      border: 2px dashed #ccc; border-radius: 6px; padding: 20px; text-align: center;
      cursor: pointer; position: relative; background: #fafafa;
    }
    .image-upload-zone:hover { border-color: var(--color-primary, #333); background: #f0f0f0; }
    .image-upload-zone input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    
    .thumbnail-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .thumbnail-wrapper { position: relative; width: 80px; height: 80px; border-radius: 4px; overflow: hidden; border: 1px solid #eee; }
    .thumbnail-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .thumbnail-remove { position: absolute; top: 2px; right: 2px; background: rgba(255,0,0,0.8); color: white; border: none; width: 20px; height: 20px; border-radius: 50%; font-size: 10px; cursor: pointer; }
    
    .admin-pane-right { flex: 1; background: #F8F7F3; overflow-y: auto; padding: 30px; }
    .preview-header { font-size: 0.85rem; color: #888; margin-bottom: 20px; }
    
    .generated-card {
      background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      max-width: 800px; margin: 0 auto;
    }
    .generated-title { font-size: 1.8rem; margin-top: 0; margin-bottom: 1rem; }
    .generated-highlights { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .highlight-tag { background: #f0f4ff; color: #0056b3; padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
    .generated-body { line-height: 1.8; color: #333; }
    .generated-body p { margin-bottom: 1em; }
    header.header { display: none !important; }
    
    .loading-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.8);
      display: none; align-items: center; justify-content: center; z-index: 100; flex-direction: column;
    }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #8b5cf6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header class="admin-header">
    <h1>ウイズささやま / フォトモード (AI記事自動生成)</h1>
    <div style="display: flex; gap: 10px;">
      <a href="/admin-menu.html" class="btn-save" style="text-decoration: none;">戻る</a>
      <button class="btn-save btn-generate" id="btn-generate">AIで記事を生成する</button>
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-pane-left">
      <div class="form-group" style="background: #f5f3ff; padding: 15px; border-radius: 8px; border: 1px dashed #a78bfa;">
        <label style="color: #6d28d9; margin-bottom: 8px;">📸 AI自動生成モードについて</label>
        <p style="font-size: 0.85rem; margin: 0; color: #555; line-height: 1.5;">
          写真を選択し、タイムライン情報（いつ・どこに行ったか）を入力してください。<br>
          AIが指定されたペルソナ（口調）に合わせて、自動でブログ記事を書き上げます。<br>
          <span style="color: #8b5cf6; font-weight: bold;">※ 生成には数秒〜十数秒かかります。</span>
        </p>
      </div>

      <div class="form-group">
        <label>写真を選択 (複数可・最大5枚推奨)</label>
        <div class="image-upload-zone" id="photo-upload-zone">
          <span style="color: #666; font-size: 0.9rem;">クリックして写真を選択</span>
          <input type="file" id="input-photos" accept="image/png, image/jpeg, image/webp" multiple>
        </div>
        <div class="thumbnail-grid" id="thumbnail-container"></div>
      </div>

      <div class="form-group">
        <label for="input-timeline">タイムライン情報（現場メモ）</label>
        <textarea id="input-timeline" placeholder="例:&#10;10:00 出発&#10;11:00 丹波篠山市の里山に到着、空気が綺麗。&#10;12:00 お弁当を食べる&#10;14:00 ツアー終了、とても楽しかった"></textarea>
      </div>

      <div class="form-group">
        <label for="input-persona">ペルソナ (記事の雰囲気・口調)</label>
        <select id="input-persona">
          <option value="casual_sns">カジュアル (SNS・友達に話しかけるような親しみやすいブログ風)</option>
          <option value="formal_report">フォーマル (丁寧な言葉遣いでのイベントレポート風)</option>
          <option value="poetic_traveler">詩的・旅行記 (情景描写を豊かにし、少しノスタルジックなトーン)</option>
        </select>
      </div>
      
      <div class="form-group" style="margin-top: 40px; text-align: center;">
         <button class="btn-save" id="btn-copy-html" style="width: 100%; border: 1px solid #ccc; display: none;">記事のHTMLをコピーする</button>
         <p style="font-size: 0.8rem; color: #888; margin-top: 10px; display: none;" id="copy-hint">コピーして「お知らせ入稿画面」の本文に貼り付けることができます。</p>
      </div>
    </aside>

    <main class="admin-pane-right">
      <div class="preview-header">生成された記事プレビュー</div>
      
      <div class="generated-card" id="generated-container" style="position: relative; display: none;">
        <div class="loading-overlay" id="loading-overlay">
          <div class="spinner"></div>
          <div style="font-weight: bold; color: #6d28d9;">AIが記事を執筆中...</div>
        </div>
        
        <h2 class="generated-title" id="output-title"></h2>
        <div class="generated-highlights" id="output-highlights"></div>
        <div class="generated-body" id="output-body"></div>
      </div>
      
      <div id="initial-state" style="text-align: center; color: #aaa; margin-top: 20vh;">
        <div style="font-size: 3rem; margin-bottom: 20px;">🤖</div>
        <p>左側のフォームを入力して「AIで記事を生成する」ボタンを押すと<br>ここに生成された記事が表示されます。</p>
      </div>
    </main>
  </div>

  <script type="module" src="/admin-photo-mode.js"></script>
</body>
</html>
