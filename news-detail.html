<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>お知らせ詳細｜ウイズささやま</title>
    <meta
      name="description"
      content="一般社団法人ウイズささやまの最新情報・お知らせの詳細ページです。"
    />
    <link rel="stylesheet" href="./style.css" />
    <style>
      .news-detail-page {
        --detail-ink: #263d3c;
        --detail-muted: #7e8582;
        --detail-line: #d5d8d5;
        --detail-accent: #b5a883;
        --detail-footer: #203c3d;
        background: #fff;
        color: var(--detail-ink);
      }

      .news-detail-page .header {
        background: rgba(255, 255, 255, 0.97);
        border-bottom: 1px solid #ecefed;
        box-shadow: none;
      }

      .news-detail-page .detail-main {
        padding: 170px 0 90px;
      }

      .news-detail-page .detail-inner {
        width: min(100% - 40px, 1080px);
        margin: 0 auto;
      }

      .news-detail-page .detail-header {
        margin-bottom: 34px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--detail-line);
      }

      .news-detail-page .detail-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 18px;
      }

      .news-detail-page .detail-category {
        min-width: 92px;
        padding: 5px 10px;
        background: var(--detail-accent);
        color: #fff;
        font-size: 0.76rem;
        line-height: 1.4;
        text-align: center;
        letter-spacing: 0.04em;
      }

      .news-detail-page .detail-date {
        color: #b1a68c;
        font-size: 0.86rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0;
      }

      .news-detail-page .detail-title {
        max-width: 780px;
        color: #4b5552;
        font-family: var(--font-base);
        font-size: clamp(1.35rem, 2.4vw, 1.9rem);
        font-weight: 400;
        line-height: 1.7;
        letter-spacing: 0.04em;
      }

      .news-detail-page .detail-content {
        display: grid;
        grid-template-columns: minmax(0, 760px);
        gap: 72px;
        align-items: start;
      }

      .news-detail-page .detail-content.has-cover {
        grid-template-columns: minmax(0, 1fr) minmax(260px, 340px);
      }

      .news-detail-page .detail-cover {
        width: 100%;
        margin: 0;
        background: #fff;
      }

      .news-detail-page .detail-cover[hidden] {
        display: none;
      }

      .news-detail-page .detail-cover img {
        width: 100%;
        height: auto;
        object-fit: contain;
      }

      .news-detail-page .detail-body {
        min-width: 0;
        color: #505956;
        font-size: 1rem;
        line-height: 2.05;
        letter-spacing: 0.04em;
      }

      .news-detail-page .detail-body p {
        margin-bottom: 1.7em;
      }

      .news-detail-page .detail-body h1,
      .news-detail-page .detail-body h2,
      .news-detail-page .detail-body h3 {
        margin: 2.4em 0 0.9em;
        color: var(--detail-ink);
        font-size: 1.35rem;
        font-weight: 500;
        line-height: 1.6;
        letter-spacing: 0.06em;
      }

      .news-detail-page .detail-body h2 {
        padding-bottom: 9px;
        border-bottom: 1px solid var(--detail-line);
      }

      .news-detail-page .detail-body ul,
      .news-detail-page .detail-body ol {
        margin: 0 0 1.7em 1.4em;
      }

      .news-detail-page .detail-body ul {
        list-style: disc;
      }

      .news-detail-page .detail-body img {
        width: auto;
        max-width: 100%;
        height: auto;
        margin: 2em 0;
      }

      .news-detail-page .detail-body a {
        color: #3295ad;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .news-detail-page .preview-notice {
        margin-bottom: 2em;
        padding: 12px 14px;
        border-left: 3px solid var(--detail-accent);
        background: #f5f3ec;
        color: #6f746f;
        font-size: 0.86rem;
        line-height: 1.8;
      }

      .news-detail-page .detail-message {
        padding: 42px 0;
        color: var(--detail-muted);
        text-align: left;
      }

      .news-detail-page .back-to-list {
        margin-top: 58px;
        padding-top: 26px;
        border-top: 1px solid var(--detail-line);
      }

      .news-detail-page .back-to-list a {
        color: #66726f;
        font-size: 0.9rem;
      }

      .news-detail-page .footer {
        border-top: 0;
        background: var(--detail-footer);
        color: rgba(255, 255, 255, 0.84);
        padding: 46px 0 24px;
      }

      .news-detail-page .footer-top {
        align-items: flex-start;
        margin-bottom: 38px;
      }

      .news-detail-page .footer-left {
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr);
        gap: 24px;
        align-items: start;
        max-width: 560px;
      }

      .news-detail-page .footer-mark {
        width: 92px;
        height: auto;
      }

      .news-detail-page .footer-logo {
        margin-bottom: 6px;
        font-size: 1.5rem;
        letter-spacing: 0.08em;
      }

      .news-detail-page .footer-info {
        font-size: 0.8rem;
        line-height: 1.9;
      }

      .news-detail-page .footer-nav {
        gap: 54px;
      }

      .news-detail-page .footer-nav-col {
        gap: 7px;
      }

      .news-detail-page .footer-nav-col a {
        font-size: 0.82rem;
      }

      .news-detail-page .footer-logo,
      .news-detail-page .footer-info,
      .news-detail-page .footer-nav-col a,
      .news-detail-page .footer-bottom {
        color: rgba(255, 255, 255, 0.8);
      }

      .news-detail-page .footer-bottom {
        border-top-color: rgba(255, 255, 255, 0.2);
      }

      @media (max-width: 760px) {
        .news-detail-page .detail-main {
          padding: 134px 0 64px;
        }

        .news-detail-page .detail-inner {
          width: min(100% - 28px, 1080px);
        }

        .news-detail-page .detail-header {
          margin-bottom: 28px;
          padding-bottom: 24px;
        }

        .news-detail-page .detail-content,
        .news-detail-page .detail-content.has-cover {
          grid-template-columns: 1fr;
          gap: 28px;
        }

        .news-detail-page .detail-cover {
          width: min(100%, 480px);
          order: -1;
        }

        .news-detail-page .detail-body {
          font-size: 0.94rem;
        }

        .news-detail-page .footer-nav {
          width: 100%;
          gap: 28px;
        }

        .news-detail-page .footer-left {
          grid-template-columns: 58px minmax(0, 1fr);
          gap: 16px;
          max-width: none;
          width: 100%;
        }

        .news-detail-page .footer-mark {
          width: 58px;
        }

        .news-detail-page .footer-logo {
          font-size: 1.08rem;
        }
      }
    </style>
    <meta

      content="丹波篠山,最新情報,お知らせ,イベント,農業体験,里山体験,ウイズささやま"
